[tool.poetry]
name = "Update Password - CCP"
version = "0.1.0"
description = "Change the password of any windows computer by a click of a button. Applicaton needs to be run as an adminstrator for it to work properly."
authors = ["Govine G. Jarrett <Govine I.T Solutions>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
pygubu = "^0.24.1"
